# The Worker: a Tdarr node on a Linux PC with an NVIDIA GPU, transcoding for an
# Instance that runs the "transcode" Profile. This is its own compose project, run on
# the Worker (not on the Instance). Needs the NVIDIA Container Toolkit. Guide, with the
# Windows alternative: docs/transcode.md.
#
#   cp .env.example .env    # fill it in
#   docker compose up -d
name: media-stack-worker

services:
  tdarr-node:
    # Same version as the Instance's Tdarr server: a node on another version is refused.
    image: ghcr.io/haveagitgat/tdarr_node:2.96.01
    container_name: tdarr-node
    restart: unless-stopped
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
      # Unique per Worker and per OS, e.g. pc-3070-linux (and pc-3070-win for Windows).
      nodeName: ${TDARR_NODE_NAME:?set TDARR_NODE_NAME in .env}
      serverURL: http://${TDARR_SERVER_IP:?set TDARR_SERVER_IP in .env}:8266
      serverIP: ${TDARR_SERVER_IP:?set TDARR_SERVER_IP in .env}
      serverPort: "8266"
      # Only if Tdarr's authentication is turned on (Tdarr > Tools > API keys).
      apiKey: ${TDARR_API_KEY:-}
      inContainer: "true"
      ffmpegVersion: "7"
      nodeType: mapped
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      # The Instance's library, mounted here over SMB, at the same path the server uses:
      # no path translator is needed.
      - ${WORKER_LIBRARY:?set WORKER_LIBRARY in .env}:/data/media
      # Transcode cache on the Worker's own disk (the server's /temp maps to it).
      - ${WORKER_CACHE:?set WORKER_CACHE in .env}:/temp
      - ${WORKER_DATA:?set WORKER_DATA in .env}/configs:/app/configs
      - ${WORKER_DATA:?set WORKER_DATA in .env}/logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
