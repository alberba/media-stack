# Profile "seeding": tools around qBittorrent. qui is a faster web UI for it (reach it at
# http://qbittorrent:8080); cleanuparr removes stalled and unwanted downloads and, since
# it sees the same /data/torrents, can tell which ones no longer have a hardlink.
services:
  qui:
    image: ghcr.io/autobrr/qui:v1.31.1
    container_name: qui
    profiles: [seeding]
    restart: unless-stopped
    ports:
      - 7476:7476
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/qui:/config
    networks:
      - media

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.8
    container_name: cleanuparr
    profiles: [seeding]
    restart: unless-stopped
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
    ports:
      - 11011:11011
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/cleanuparr:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}/torrents:/data/torrents
    networks:
      - media

networks:
  media:
    name: ${MEDIA_NETWORK:-media-network}
    external: true
