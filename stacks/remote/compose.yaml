# Profile "remote": Tailscale, to reach the Instance (and, as a subnet router, the rest
# of the LAN) from your own devices without opening ports. Its state lives in the App
# data, so the node keeps its identity across restarts, reinstalls and restores; to
# move an existing node here, copy its state folder in (docs/profiles.md).
services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    container_name: tailscale
    profiles: [remote]
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-media-stack}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-media-stack}
      # Only needed the first time; ignored once the state holds a login.
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_ROUTES: ${TAILSCALE_ROUTES:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/tailscale:/var/lib/tailscale
