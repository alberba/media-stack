# Profile "vo": a second Radarr and Sonarr for an original-version library, next to the
# Core ones. Same VPN, same DATA_ROOT (so imports are still hardlinks), their own App
# data and ports (published by gluetun). Give them their own root folders, e.g.
# /data/media/movies-vo and /data/media/tv-vo, and their own qBittorrent categories.
services:
  radarr-vo:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls315
    container_name: radarr-vo
    profiles: [vo]
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
      # Shares gluetun's network with the Core Radarr, so it needs another port.
      RADARR__SERVER__PORT: "7879"
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/radarr-vo:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fso /dev/null http://localhost:7879/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sonarr-vo:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls324
    container_name: sonarr-vo
    profiles: [vo]
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
      SONARR__SERVER__PORT: "8990"
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/sonarr-vo:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fso /dev/null http://localhost:8990/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
