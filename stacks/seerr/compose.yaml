# Request portal for Viewers. Reaches Jellyfin at http://jellyfin:8096 and
# Radarr/Sonarr at http://radarr:7878 and http://sonarr:8989.
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:?set TZ in .env}
      LOG_LEVEL: info
      PORT: "5055"
      # Seerr's API key, so the Wiring and issue-automator know it without reading it.
      API_KEY: ${SEERR_API_KEY:-}
    ports:
      - 5055:5055
    volumes:
      # Owned by UID 1000 (the image's `node` user); scripts/init.sh sets that up.
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/seerr:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - media

networks:
  media:
    name: ${MEDIA_NETWORK:-media-network}
    external: true
