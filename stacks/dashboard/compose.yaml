# Profile "dashboard": Homarr (a start page with every service).
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v2.1.2
    container_name: homarr
    profiles: [dashboard]
    restart: unless-stopped
    environment:
      TZ: ${TZ:?set TZ in .env}
      # Not ":?": Compose would then demand it from Instances without this Profile.
      # scripts/init.sh fails when it is empty and the Profile is on.
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_KEY:-}
    ports:
      - 7575:7575
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/homarr:/appdata
      # Only shows container status. Note that ":ro" stops writes to the socket file,
      # not calls to the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media

networks:
  media:
    name: ${MEDIA_NETWORK:-media-network}
    external: true
