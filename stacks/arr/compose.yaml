# Movie and series managers plus subtitles. They run behind the VPN (see stacks/vpn),
# which also publishes their ports. Downloads and library share DATA_ROOT so imports
# are hardlinks, not copies.
services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319
    container_name: radarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      wire-seed:
        condition: service_completed_successfully
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/radarr:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fso /dev/null http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    container_name: sonarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      wire-seed:
        condition: service_completed_successfully
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/sonarr:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fso /dev/null http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls366
    container_name: bazarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      wire-seed:
        condition: service_completed_successfully
    environment:
      PUID: ${PUID:?set PUID in .env}
      PGID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in .env}/bazarr:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}/media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:6767 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
