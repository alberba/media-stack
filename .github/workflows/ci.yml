name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: shellcheck scripts/*.sh tests/*.sh stacks/*/*.sh .githooks/pre-commit
      - name: Validate the Core, and the Core with every Profile, with docker compose config
        run: |
          sed -E '/^(COMPOSE_PROFILES|BACKUP_SOURCE)=/!s/^([A-Z_]+)=$/\1=ci-dummy/' .env.example > .env
          docker compose config --quiet
          docker compose --profile '*' config --quiet
          COMPOSE_FILE=compose.yaml:compose.gpu.yaml docker compose --profile '*' config --quiet
      - name: Validate the Worker's compose
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=ci-dummy/' worker/.env.example > worker/.env
          docker compose --project-directory worker config --quiet
      - name: Template tests
        run: tests/template.test.sh
      - name: init.sh tests
        run: sudo tests/init.test.sh
      - name: setup.sh tests
        run: tests/setup.test.sh
      - name: verify.sh tests
        run: tests/verify.test.sh
      - name: pre-commit hook tests
        run: tests/hooks.test.sh
      - name: Wiring tests
        run: tests/wire.test.sh
      - name: extras Profile issue-automator tests
        run: tests/issue-automator.test.sh
      - name: transcode Profile Tdarr plugin tests
        run: tests/tdarr-plugin.test.sh
      - name: Build the locally built Profile images
        run: docker compose --profile '*' build
      - name: Install sqlite3 for the backup tests
        run: command -v sqlite3 || { sudo apt-get update && sudo apt-get install -y sqlite3; }
      - name: backup Profile script tests
        run: tests/backup.test.sh
      - name: backup Profile image, backup and restore round trip
        run: tests/backup-image.test.sh
