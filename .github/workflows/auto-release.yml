name: Automatic release

# Publishes compatible changes on main as a release (scripts/auto-release.sh), so
# Instances with unattended upgrades pick them up. Majors stay manual: docs/upgrading.md.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency: auto-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Require a green CI run on this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo 'main is already a release.'; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha="$(git rev-parse HEAD)"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq .total_count)"
          if [ "$count" -gt 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CI has not passed on $sha yet; no release today."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the release
        id: prepare
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/auto-release.sh
      - name: Publish the release
        if: steps.prepare.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git push origin HEAD:main "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "docs/releases/$VERSION.md"
