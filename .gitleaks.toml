# gitleaks config: the default rules, plus the secrets this stack handles.
[extend]
useDefault = true

[[rules]]
id = "wireguard-private-key"
description = "WireGuard private key"
regex = '''(?i)(?:WIREGUARD_PRIVATE_KEY|PrivateKey)\s*[=:]\s*["']?([A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=)'''
secretGroup = 1

[[rules]]
id = "env-secret-value"
description = "Password, token or API key assigned in an env-style file"
# [ \t], not \s: an empty value must not run on into the next line.
regex = '''(?m)^[ \t]*[A-Z0-9_]*(?:PASSWORD|TOKEN|API_KEY|APIKEY|SECRET|AUTH_KEY)[A-Z0-9_]*[ \t]*=[ \t]*["']?([^\s"'#]{8,})'''
secretGroup = 1

# The ingest tests sign requests with a made-up secret, so their fixtures look like
# credentials in every commit that introduced them. Only these two files, only these
# two rules; a real key anywhere else still fails the scan.
[[allowlists]]
description = "Made-up NOTIFY_INGEST_SECRET fixtures in the ingest tests"
targetRules = ["generic-api-key", "env-secret-value"]
paths = [
  '''tests/backup\.test\.sh''',
  '''tests/issue-automator\.test\.sh''',
]
